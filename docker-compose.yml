x-laravel-service: &laravel-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: flight-aggregator-app
  restart: unless-stopped
  working_dir: /var/www
  volumes:
    - .:/var/www
  env_file:
    - .env
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - flight-network

services:
  app:
    <<: *laravel-service
    command: ["php-fpm", "-F"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  queue-worker:
    <<: *laravel-service
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=supplier-polling,default
      - --sleep=3
      - --tries=3
      - --timeout=60
      - --max-time=3600
    stop_grace_period: 70s

  scheduler:
    <<: *laravel-service
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - flight-network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flight-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - flight-network

networks:
  flight-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
